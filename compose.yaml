name: elseview

services:
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    working_dir: /app/backend
    user: "10001:10001"
    command: ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      APP_ENV: development
      AI_MODE: mock
      DATABASE_URL: "postgresql+psycopg://app:${DB_APP_PASSWORD:?run setup}@database:5432/elseview_app"
      MIGRATION_DATABASE_URL: "postgresql+psycopg://app_owner:${DB_OWNER_PASSWORD:?run setup}@database:5432/elseview_app"
      TEST_DATABASE_URL: "postgresql+psycopg://test_owner:${DB_TEST_PASSWORD:?run setup}@database:5432/elseview_test"
      CACHE_URL: "redis://:${CACHE_PASSWORD:?run setup}@cache:6379/0"
      SECRET_KEY: "${SECRET_KEY:?run setup}"
      PUBLIC_ORIGIN: http://localhost:8080
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      PRIVATE_ROOT: /app/private
      JOB_RUNNER_ENABLED: "false"
      LOG_LEVEL: INFO
    volumes:
      - private_data:/app/private
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3); assert r.status == 200; assert isinstance(json.load(r), dict)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  database:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run setup}"
      DB_OWNER_PASSWORD: "${DB_OWNER_PASSWORD:?run setup}"
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:?run setup}"
      DB_TEST_PASSWORD: "${DB_TEST_PASSWORD:?run setup}"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  cache:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    user: valkey
    environment:
      CACHE_PASSWORD: "${CACHE_PASSWORD:?run setup}"
    command:
      - /bin/sh
      - -ec
      - |
        case "$$CACHE_PASSWORD" in *[!0-9a-f]*|'') echo 'CACHE_PASSWORD must be hex64' >&2; exit 1;; esac
        [ "$${#CACHE_PASSWORD}" -eq 64 ] || exit 1
        umask 077
        config=$$(mktemp /tmp/valkey.XXXXXX)
        printf 'bind 0.0.0.0\nprotected-mode yes\nport 6379\nsave ""\nappendonly no\nrequirepass %s\n' "$$CACHE_PASSWORD" > "$$config"
        exec valkey-server "$$config"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$CACHE_PASSWORD\" valkey-cli -h 127.0.0.1 ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: elseview_postgres_data
  private_data:
    name: elseview_private_data
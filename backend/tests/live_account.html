<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live account integration fixture</title><style>body{margin:0}iframe{display:block;width:100%;height:95vh;border:0}#result{padding:8px}</style></head><body>
<iframe title="Real Elseview account application" src="/#/sign-in"></iframe><p id="result" role="status">Running real browser/API/database account journey…</p>
<script type="module">
const fixture = __ACCOUNT_FIXTURE__;
const frame = document.querySelector('iframe');
const doc = () => frame.contentDocument;
const pause = () => new Promise(resolve => setTimeout(resolve, 30));
const assert = (value, message) => { if (!value) throw new Error(message); };
async function wait(check, stage) { for (let i=0; i<300; i++) { if (check()) return; await pause(); } throw new Error(`Timed out: ${stage}`); }
const button = label => [...doc().querySelectorAll('button')].find(node => node.textContent === label);
function value(name, text) { const input = doc().querySelector(`input[name="${name}"]`); Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype, 'value').set.call(input, text); input.dispatchEvent(new frame.contentWindow.Event('input', {bubbles:true})); }
async function signIn() { await wait(() => button('Sign in'), 'sign-in form'); value('email', fixture.email); value('password', fixture.password); button('Sign in').click(); await wait(() => button('Sign out'), 'authenticated account'); }
function cleanMemorySurface() { assert(!frame.contentWindow.localStorage.length && !frame.contentWindow.sessionStorage.length, 'Credentials persisted in browser storage'); assert(!frame.contentWindow.location.href.includes(fixture.password), 'Password in URL'); assert(!doc().body.innerText.includes(fixture.password), 'Password rendered'); assert(doc().querySelectorAll('main').length === 1, 'Expected one main landmark'); assert(doc().documentElement.scrollWidth <= frame.clientWidth, 'Horizontal overflow'); }
try {
  assert((await fetch('/api/v1/health/ready')).ok, 'Live API readiness failed');
  await signIn();
  await wait(() => doc().body.innerText.includes('No workspaces yet.'), 'initial empty state');
  value('name', fixture.workspace); button('Create workspace').click();
  await wait(() => [...doc().querySelectorAll('h2')].some(node => node.textContent === fixture.workspace), 'persisted workspace detail');
  await wait(() => doc().body.innerText.includes('No studies are available'), 'authorized study empty state');
  cleanMemorySurface();
  const reports = [...doc().querySelectorAll('a')].find(node => node.textContent === 'Research reports and exports');
  assert(reports, 'Reports navigation missing'); reports.click();
  await wait(() => doc().body.innerText.includes('No reports'), 'real report index empty state');
  cleanMemorySurface();
  doc().querySelector('a[href="#/participant/profile"]').click();
  await wait(() => doc().body.innerText.includes('No public-panel profile exists yet'), 'real profile first-use state');
  value('age', '32');
  const consentDocument = [...doc().querySelectorAll('summary')].find(node => node.textContent === 'Read panel consent · version 1');
  assert(consentDocument, 'Current panel consent document missing'); consentDocument.click();
  assert(consentDocument.parentElement.open, 'Consent document did not open');
  doc().querySelector('input[name="panel-consent"]').click();
  await pause();
  button('Join public panel').click();
  await wait(() => doc().body.innerText.includes('Public-panel profile and consent saved'), 'real profile creation and consent');
  cleanMemorySurface();
  frame.contentWindow.location.reload();
  await signIn();
  await wait(() => button('Save profile and consent'), 'profile retained after deep-link reload');
  assert(doc().querySelector('input[name="age"]').value === '32', 'Saved profile detail was not retained');
  cleanMemorySurface();
  doc().querySelector('a[href="#/workspaces"]').click();
  await wait(() => [...doc().querySelectorAll('a')].some(node => node.textContent === fixture.workspace), 'workspace retained after reload');
  doc().querySelector('a[href="#/participant/assessments"]').click();
  await wait(() => doc().querySelector('h2')?.textContent.includes('Language assessments'), 'participant assessment navigation');
  cleanMemorySurface();
  doc().querySelector('a[href="#/participant/history"]').click();
  await wait(() => doc().body.innerText.includes('No participation records yet'), 'real participant history empty state');
  cleanMemorySurface();
  doc().querySelector('a[href="#/login-sessions"]').click();
  await wait(() => doc().querySelectorAll('input[type="radio"]').length === 2, 'two persisted login sessions');
  const other = [...doc().querySelectorAll('label')].find(node => node.textContent.startsWith('Other session'));
  other.querySelector('input').click();
  await wait(() => !button('Confirm end selected session').disabled, 'other-session confirmation');
  button('Confirm end selected session').click();
  await wait(() => doc().querySelectorAll('input[type="radio"]').length === 1, 'other-session revocation');
  doc().querySelector('input[type="radio"]').click();
  await wait(() => !button('Confirm end selected session').disabled, 'current-session confirmation');
  button('Confirm end selected session').click();
  await wait(() => button('Sign in') && doc().body.innerText.includes('This login session was ended.'), 'current-session revocation');
  assert(!doc().body.innerText.includes(fixture.workspace), 'Private workspace remained after revocation');
  cleanMemorySurface();
  document.querySelector('#result').textContent = 'PASS: real built UI, HTTP API, PostgreSQL and Valkey; login, workspace creation/reload, assessment navigation and both session revocations. No mocked browser transport.';
} catch (error) { document.querySelector('#result').textContent = 'FAIL: ' + error.message; }
</script></body></html>

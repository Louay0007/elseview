services:
  frontend:
    build:
      target: development
    # Match the production listener, so the base port mapping remains unchanged.
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
  backend:
    volumes:
      - ./backend:/app/backend
      - ./compose.yaml:/app/compose.yaml:ro
      - ./compose.dev.yaml:/app/compose.dev.yaml:ro
      - ./scripts:/app/scripts:ro
      - ./frontend/Dockerfile:/app/frontend/Dockerfile:ro
      - ./frontend/AdvancedMethods.jsx:/app/frontend/AdvancedMethods.jsx:ro
    command: ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload"]